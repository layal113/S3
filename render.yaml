# Render Blueprint Specification for S3 (Miqyas)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Machine Learning Backend Web Service
  - type: web
    name: s3-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 2. Expo React Native Web Frontend Static Site
  - type: static
    name: s3-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA Rewrite: ensures deep links and refreshes on /some/route do not 404 on Render.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: EXPO_PUBLIC_API_URL
        value: https://miqyas-backend.onrender.com
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://miqyas-backend.onrender.com
